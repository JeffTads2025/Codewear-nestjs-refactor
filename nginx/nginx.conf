server {
    listen 8080;
    server_name _;
    client_max_body_size 5m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /login {
        proxy_pass http://service-catalog:3000/login;
    }

    location = /login/ {
        proxy_pass http://service-catalog:3000/login;
    }

    location /orders {
        proxy_pass http://service-orders:3001;
    }

    location /checkout {
        proxy_pass http://service-orders:3001;
    }

    location /cart {
        proxy_pass http://service-orders:3001;
    }

    location ~* ^/uploads/([a-f0-9-]+\.(?:jpg|jpeg|png|webp))$ {
        alias /usr/share/nginx/html/uploads/$1;
        autoindex off;
        limit_except GET HEAD {
            deny all;
        }
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location /uploads/ {
        return 404;
    }

    location = /admin/dashboard {
        proxy_pass http://service-orders:3001/admin/dashboard;
    }

    location = /admin/metrics {
        proxy_pass http://service-orders:3001/admin/metrics;
    }

    location = /admin/revenue {
        proxy_pass http://service-orders:3001/admin/revenue;
    }

    location = /admin/all-orders {
        proxy_pass http://service-orders:3001/admin/all-orders;
    }

    location = /admin/users {
        proxy_pass http://service-catalog:3000/admin/users;
    }

    location = /admin/logs {
        proxy_pass http://service-catalog:3000/admin/logs;
    }

    location / {
        proxy_pass http://service-catalog:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: codewear
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-senha}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-senha}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - codewear

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - codewear

  service-catalog:
    build:
      context: ./Backend-NestJS
      dockerfile: apps/service-catalog/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: codewear
      DB_USER: root
      DB_PASS: ${DB_PASS:-senha}
      REDIS_URL: redis://redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-60}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codewear

  service-orders:
    build:
      context: ./Backend-NestJS
      dockerfile: apps/service-orders/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: codewear
      DB_USER: root
      DB_PASS: ${DB_PASS:-senha}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - codewear

  nginx:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./uploads:/usr/share/nginx/html/uploads:ro
    depends_on:
      - service-catalog
      - service-orders
    networks:
      - codewear

volumes:
  mysql_data:
    external: true
    name: codewear_mysql-data

networks:
  codewear:
    driver: bridge

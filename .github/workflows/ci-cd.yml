name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-backend:
    name: Test and build backend services
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend-NestJS
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Backend-NestJS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build service-catalog
        run: npm run build:catalog

      - name: Build service-orders
        run: npm run build:orders
